<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f4ee">
<title>Zapisz czas · Czasy biegowe</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17221a;background:#f3f4ee;color-scheme:light}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1000px;margin:auto;padding:clamp(28px,7vw,76px) clamp(18px,5vw,44px)}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:clamp(38px,7vw,68px);letter-spacing:-.065em;line-height:1;margin:0}
button,.back{font:inherit;font-size:.875rem;font-weight:650;background:#e4ebdc;color:#233524;border:1px solid #cbd8c4;border-radius:100px;padding:10px 17px;cursor:pointer}
button:hover,.back:hover{background:#d8e4cf}
button:disabled{opacity:.65;cursor:wait}
button:focus-visible,.back:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #27573a;outline-offset:3px}
.notice{font-size:.875rem;color:#5b665c;margin:16px 0 0}
.notice:empty{margin:0}
.back{display:inline-block;text-decoration:none}
form{background:#fff;border:1px solid #dde3d8;border-radius:22px;padding:clamp(18px,3vw,28px)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
label{display:block;font-weight:650;margin-bottom:8px}
input,select{width:100%;font:inherit;color:inherit;background:#f7f8f4;border:1px solid #cbd8c4;border-radius:12px;padding:12px}
input{font-variant-numeric:tabular-nums}
small{display:block;font-size:.875rem;color:#5b665c;margin-top:6px}
form button{margin-top:20px}
.notice[data-state=success]{color:#245433}
.notice[data-state=error]{color:#873f21}
@media(max-width:580px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Zapisz czas</h1>
    <a class="back" href="/">Wróć do wyników</a>
  </header>
  <form id="update-form">
    <div class="fields">
      <div>
        <label for="distance">Dystans</label>
        <select id="distance" name="distance">
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="21">Półmaraton</option>
          <option value="42">Maraton</option>
        </select>
      </div>
      <div>
        <label for="time">Czas</label>
        <input id="time" name="time" type="text" placeholder="01:01:01"
               autocomplete="off" spellcheck="false" required aria-describedby="time-format">
        <small id="time-format">Format hh:mm:ss, np. 01:01:01.</small>
      </div>
    </div>
    <button type="submit">Zapisz wynik</button>
    <p class="notice" role="status"></p>
  </form>
</main>
<script>
const form = document.querySelector("#update-form");
const distance = document.querySelector("#distance");
const time = document.querySelector("#time");
const save = form.querySelector("button");
const notice = form.querySelector(".notice");

function showNotice(state, message) {
  notice.dataset.state = state;
  notice.textContent = message;
}

time.addEventListener("input", () => time.setCustomValidity(""));

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (save.disabled) return;

  const value = time.value.trim();
  if (!/^[0-9]{2}:[0-5][0-9]:[0-5][0-9]$/.test(value)) {
    time.setCustomValidity("Wpisz czas w formacie hh:mm:ss, np. 01:01:01.");
    time.reportValidity();
    return;
  }

  const path = "/api/run/update/" + distance.value;
  const query = new URLSearchParams({ time: value });
  const label = distance.selectedOptions[0].textContent;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);

  save.disabled = distance.disabled = time.disabled = true;
  showNotice("pending", "Zapisywanie wyniku…");

  try {
    const response = await fetch(path + "?" + query, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal,
    });
    const result = await response.json().catch(() => null);
    if (!response.ok || result?.error) {
      const message = typeof result?.error === "string"
        ? result.error
        : "API odrzuciło zapis (HTTP " + response.status + ").";
      showNotice("error", message);
      return;
    }
    showNotice("success", "Zapisano wynik " + value + " (" + label + ").");
  } catch {
    showNotice("error", "Nie udało się potwierdzić zapisu. Sprawdź aktualny czas w wynikach.");
  } finally {
    clearTimeout(timeout);
    save.disabled = distance.disabled = time.disabled = false;
  }
});
</script>
</body>
</html>
